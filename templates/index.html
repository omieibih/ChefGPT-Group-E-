<!DOCTYPE html>
<html>
<head>
    <title>ChefGPT</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <nav class="page-nav">
            <div class="page-nav__links">
                <a href="/favorites" class="nav-link nav-link--warm">⭐ My Favorites</a>
                <a href="/shopping-list" class="nav-link nav-link--cool">🛒 Shopping List</a>
            </div>
            <div class="page-nav__user">
                <span id="user-email" class="user-email-text"></span>
                <button id="logout-btn" class="logout-btn">Log Out</button>
            </div>
        </nav>

        <h1>👨‍🍳 ChefGPT</h1>
        <p>First, choose your cooking experience level.</p>

        <!-- Choose your experience level before inputting ingredients -->
        <form action="/ingredients" method="POST">
            <label for="experience_level" class="label-centered">🍳 What is your cooking experience level?</label>
            <select id="experience_level" name="experience_level" required>
                <option value="Beginner" selected>Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
            <button type="submit">Next</button>
        </form>
    </div>

    <!-- Simple floating assistant bubble and card. -->
    <button id="assistant-toggle" class="assistant-toggle" aria-label="Open ingredient assistant">+</button>
    <div id="assistant-panel" class="assistant-panel" aria-hidden="true">
        <p id="assistant-message" class="assistant-message">Open for a quick suggestion.</p>
        <button id="assistant-lucky" class="assistant-lucky" type="button">I'm Feeling Lucky</button>
        <div id="assistant-chips" class="assistant-chips"></div>
    </div>

    <script type="module">
        import { auth } from "/static/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/login";
            } else {
                document.getElementById("user-email").textContent = user.email;
            }
        });

        document.getElementById("logout-btn").addEventListener("click", () => {
            signOut(auth).then(() => window.location.href = "/login");
        });
    </script>
    <script type="module" src="/static/assistant.js?v=8"></script>
</body>
</html>
